name: Build LaTeX Documents

on:
  push:
    branches:
      - main  # Puoi specificare altri rami se necessario

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Installa LaTeX
      # Questo step installa una distribuzione completa di LaTeX. Se preferisci una versione più leggera, puoi personalizzare questo comando.
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      # Step 3: Compila il CV in Inglese
      - name: Compile CV-EN
        run: |
          cd CV-EN
          latexmk -pdf -shell-escape main.tex

      # Step 4: Rinomina il PDF del CV in Inglese
      - name: Rename CV-EN PDF
        run: mv CV-EN/main.pdf CV_EN.pdf

      # Step 5: Compila il CV in Italiano
      - name: Compile CV-IT
        run: |
          cd CV-IT
          latexmk -pdf -shell-escape main.tex

      # Step 6: Rinomina il PDF del CV in Italiano
      - name: Rename CV-IT PDF
        run: mv CV-IT/main.pdf CV_IT.pdf

      # Step 7: Carica entrambi i PDF come artifact
      - name: Upload PDF files
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX_PDFs
          path: |
            CV_EN.pdf
            CV_IT.pdf
