name: Build LaTeX Documents

on:
  push:
    branches:
      - main  # Specifica i rami che preferisci

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Installare LaTeX e Biber
      - name: Install LaTeX and Biber
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full biber

      # Step 3: Verificare la presenza delle immagini nel CV-EN
      - name: List CV-EN/cve/ directory
        run: |
          echo "Contenuto di CV-EN/cve/:"
          ls -l CV-EN/cve/

      # Step 4: Verificare la presenza delle immagini nel CV-IT
      - name: List CV-IT/cve/ directory
        run: |
          echo "Contenuto di CV-IT/cve/:"
          ls -l CV-IT/cve/

      # Step 5: Compilare il CV in Inglese
      - name: Compile CV-EN
        run: |
          cd CV-EN
          latexmk -pdf -shell-escape main.tex

      # Step 6: Rinomina il PDF del CV in Inglese
      - name: Rename CV-EN PDF
        run: mv CV-EN/main.pdf CV_EN.pdf

      # Step 7: Compilare il CV in Italiano
      - name: Compile CV-IT
        run: |
          cd CV-IT
          latexmk -pdf -shell-escape main.tex

      # Step 8: Rinomina il PDF del CV in Italiano
      - name: Rename CV-IT PDF
        run: mv CV-IT/main.pdf CV_IT.pdf

      # Step 9: Caricare entrambi i PDF come artifact
      - name: Upload PDF files
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX_PDFs
          path: |
            CV_EN.pdf
            CV_IT.pdf
