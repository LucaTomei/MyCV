name: Build LaTeX Documents

on:
  push:
    branches:
      - main
      - master
    # Evita loop: quando il workflow committa i PDF in dist/, non si rilancia
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

concurrency:
  group: build-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache dei pacchetti APT + TeXLive (accelera parecchio dopo il primo run)
      - name: Cache APT
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-texlive-v1

      # Installa solo il necessario (molto più veloce di texlive-full)
      - name: Install LaTeX + tools (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            biber \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-lang-english \
            texlive-lang-italian \
            texlive-pictures \
            texlive-science \
            texlive-extra-utils \
            lmodern \
            ghostscript

      - name: Compile CV-EN
        working-directory: CV-EN
        run: |
          latexmk -pdf -shell-escape -interaction=nonstopmode -halt-on-error main.tex

      - name: Compile CV-IT
        working-directory: CV-IT
        run: |
          latexmk -pdf -shell-escape -interaction=nonstopmode -halt-on-error main.tex

      - name: Prepare dist/
        run: |
          mkdir -p dist
          mv CV-EN/main.pdf dist/CVE_EN_LucaTomei_2025.pdf
          mv CV-IT/main.pdf dist/CVE_IT_LucaTomei_2025.pdf

      - name: Commit & push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/*.pdf

          # Se non ci sono differenze (PDF identici), esci pulito
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
            exit 0
          fi

          git commit -m "chore(cv): update generated PDFs"
          git push
