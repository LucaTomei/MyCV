name: Build LaTeX Documents

on:
  push:
    branches:
      - main  # Puoi specificare altri rami se necessario

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Cache dei pacchetti LaTeX (opzionale ma consigliato)
      - name: Cache LaTeX packages
        uses: actions/cache@v3
        with:
          path: /usr/local/texlive/2024
          key: ${{ runner.os }}-latex-${{ hashFiles('**/*.tex', '**/*.bib') }}
          restore-keys: |
            ${{ runner.os }}-latex-

      # Step 3: Installare LaTeX e biber
      - name: Install LaTeX and Biber
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full biber
          sudo tlmgr install lato  # Se necessario

      # Step 4: Compilare il CV in Inglese
      - name: Compile CV-EN
        run: |
          cd CV-EN
          latexmk -pdf -shell-escape -bibtex main.tex

      # Step 5: Rinomina il PDF del CV in Inglese
      - name: Rename CV-EN PDF
        run: mv CV-EN/main.pdf CV_EN.pdf

      # Step 6: Compilare il CV in Italiano
      - name: Compile CV-IT
        run: |
          cd CV-IT
          latexmk -pdf -shell-escape -bibtex main.tex

      # Step 7: Rinomina il PDF del CV in Italiano
      - name: Rename CV-IT PDF
        run: mv CV-IT/main.pdf CV_IT.pdf

      # Step 8: Caricare entrambi i PDF come artifact
      - name: Upload PDF files
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX_PDFs
          path: |
            CV_EN.pdf
            CV_IT.pdf
