name: Release CVs

on:
  push:
    branches: [main]
    paths:
      - "CV-IT/**"
      - "CV-EN/**"
      - "common/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: the job pushes to main and moves the "latest" tag.
concurrency:
  group: release-cvs
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reproducible PDFs: pdfTeX stamps CreationDate/ModDate (and derives the
      # trailer ID) from SOURCE_DATE_EPOCH, so unchanged sources give an
      # identical file and nothing is committed.
      - name: Pin document date to the last content change
        run: |
          epoch=$(git log -1 --format=%ct -- CV-IT CV-EN common)
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "FORCE_SOURCE_DATE=1" >> "$GITHUB_ENV"

      - name: Compile English CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV-EN/main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build/en

      - name: Compile Italian CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV-IT/main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build/it

      - name: Install poppler
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Parser checks
        run: |
          scripts/check-cv.sh build/en/main.pdf en
          scripts/check-cv.sh build/it/main.pdf it

      - name: Collect artefacts
        run: |
          mkdir -p out
          cp build/en/main.pdf out/Luca_Tomei_CV_EN.pdf
          cp build/it/main.pdf out/Luca_Tomei_CV_IT.pdf
          # Legacy asset names, still requested by lucasmac.xyz
          cp out/Luca_Tomei_CV_EN.pdf out/CVE_EN_LucaTomei.pdf
          cp out/Luca_Tomei_CV_IT.pdf out/CVE_IT_LucaTomei.pdf
          # Page previews for the README (preview-en-1.png, preview-en-2.png, ...)
          pdftoppm -png -r 110 build/en/main.pdf out/preview-en
          pdftoppm -png -r 110 build/it/main.pdf out/preview-it

      - name: Update dist
        run: |
          mkdir -p dist
          rm -f dist/*
          cp out/Luca_Tomei_CV_EN.pdf out/Luca_Tomei_CV_IT.pdf out/preview-*.png dist/
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git config user.name "LucaTomei"
            git config user.email "46397302+LucaTomei@users.noreply.github.com"
            git add dist
            git commit -m "Update compiled CVs"
            git push
          else
            echo "dist/ already up to date"
          fi

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Curriculum Vitae
          body: |
            PDFs compiled from the latest LaTeX sources on `main`.

            | File | Language |
            |---|---|
            | `Luca_Tomei_CV_EN.pdf` | English |
            | `Luca_Tomei_CV_IT.pdf` | Italian |

            `CVE_EN_LucaTomei.pdf` and `CVE_IT_LucaTomei.pdf` are the same files under their previous names.
          files: out/*.pdf
